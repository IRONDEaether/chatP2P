<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOO1 P2P — Secure Network</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background: #0f0c20;
            color: #fff;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .main-app {
            width: 100%;
            height: 100%;
            display: flex;
            position: relative;
        }

        /* Sidebar Responsive */
        .sidebar {
            width: 320px;
            background: rgba(20, 15, 35, 0.95);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 12px;
            z-index: 10;
            transition: all 0.3s ease;
        }

        /* Top Bar Boutique & Audio Header */
        .top-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .avatar-container {
            width: 55px; height: 55px;
            border-radius: 50%; border: 2px solid #ff79c6;
            margin: 0 auto; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; font-weight: bold; color: #ff79c6;
            cursor: pointer; background: rgba(0,0,0,0.3);
        }
        .avatar-container img { width: 100%; height: 100%; object-fit: cover; }

        input, select, button {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px; border-radius: 6px;
            color: #fff; outline: none; font-size: 12px;
        }

        button {
            background: linear-gradient(135deg, #ff79c6, #bd93f9);
            color: #000; font-weight: bold; border: none; cursor: pointer;
        }

        /* Chat Window */
        .chat-container {
            flex: 1; display: flex; flex-direction: column;
            background: rgba(10, 8, 20, 0.6); position: relative;
        }

        .salons-nav {
            display: flex; gap: 5px; padding: 10px;
            background: rgba(0,0,0,0.2); overflow-x: auto;
        }
        .salon-btn { padding: 6px 12px; font-size: 11px; }
        .salon-btn.active { background: #ff79c6; color: #000; }

        .messages-area {
            flex: 1; overflow-y: auto; padding: 15px;
            display: flex; flex-direction: column; gap: 10px;
        }

        .msg-bubble {
            max-width: 75%; padding: 8px 12px; border-radius: 10px;
            font-size: 13px; word-break: break-word;
        }
        .msg-bubble.local { align-self: flex-end; background: rgba(255, 121, 198, 0.25); border: 1px solid #ff79c6; }
        .msg-bubble.remote { align-self: flex-start; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.2); }

        .user-card {
            display: flex; align-items: center; justify-content: space-between;
            padding: 6px; background: rgba(255, 255, 255, 0.05);
            border-radius: 6px; margin-top: 4px; font-size: 11px;
        }

        .input-bar { display: flex; gap: 6px; padding: 10px; background: rgba(0,0,0,0.4); }

        /* Boutique Pop-up Mini Fenêtre */
        .modal {
            display: none; position: fixed;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; max-width: 500px; max-height: 80vh;
            background: #140f23; border: 1px solid #ff79c6;
            border-radius: 12px; padding: 15px; z-index: 100;
            overflow-y: auto; box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* Adaptabilité Mobile */
        @media (max-width: 768px) {
            .main-app { flex-direction: column; }
            .sidebar { width: 100%; height: 200px; overflow-y: auto; }
            .msg-bubble { max-width: 90%; }
        }
    </style>
</head>
<body>

<div class="main-app">
    <!-- Sidebar -->
    <div class="sidebar">
        <!-- Barre du haut avec Son et Boutique -->
        <div class="top-header-bar">
            <button onclick="playShopSound(); openShop()" style="font-size:11px;">🛍️ Boutique</button>
            <div style="display:flex; align-items:center; gap:4px;">
                <span style="font-size:10px;">🔊</span>
                <input type="range" id="volControl" min="0" max="0.3" step="0.01" value="0.05" style="width:50px;" onchange="updateVolume()">
            </div>
        </div>

        <div style="text-align: center; margin-top: 5px;">
            <div class="avatar-container" onclick="document.getElementById('photoInput').click()">
                <span id="avatarText">?</span>
                <img id="avatarImg" src="" style="display:none;">
            </div>
            <input type="file" id="photoInput" accept="image/*" style="display:none;" onchange="loadPhoto(this)">
            <small id="myIdTag" style="color:#ff79c6;">ID: ------</small>
        </div>

        <input type="text" id="myPseudo" placeholder="Mon Pseudo" oninput="syncProfile()">

        <!-- Contacts Enregistrés LocalStorage -->
        <h5 style="color:#8be9fd; font-size:11px; margin-top:6px;">👥 EN LIGNE (Cliquer pour Chatter)</h5>
        <div id="peersBox" style="flex:1; overflow-y:auto;"></div>

        <h5 style="color:#ff5555; font-size:11px; margin-top:6px;">🚫 CONTACTS BLOQUÉS</h5>
        <div id="blockedBox" style="max-height:60px; overflow-y:auto; font-size:10px;"></div>
    </div>

    <!-- Zone de Chat -->
    <div class="chat-container">
        <div class="salons-nav" id="salonsNavBox">
            <button class="salon-btn active" onclick="switchSalon('main')">🌐 Général</button>
        </div>

        <div class="messages-area" id="msgBox"></div>

        <div class="input-bar">
            <input type="text" id="chatInput" placeholder="Écrire un message P2P..." style="flex:1;" onkeypress="if(event.key==='Enter') sendCurrentMsg()">
            <button onclick="sendCurrentMsg()">Envoyer</button>
        </div>
    </div>
</div>

<!-- Fenêtre Boutique Pop-Up -->
<div class="modal" id="shopModal">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="color:#ff79c6;">🛍️ Mini Boutique P2P</h3>
        <button onclick="closeShop()" style="background:#ff5555; color:#fff; padding:2px 8px;">X</button>
    </div>
    <p style="font-size:11px; margin: 8px 0;">Débloque des fonctionnalités et salons personnalisés.</p>
    <div id="shopContent" style="font-size:12px;">
        <p>• Salon VIP Autorité (Niv 10) - <b>100 XP</b></p>
        <p>• Badge P2P Shield - <b>50 XP</b></p>
    </div>
</div>

<script>
    const socket = io();
    let myPeerId = localStorage.getItem('aoo1_id') || Math.floor(10000000 + Math.random() * 90000000).toString();
    localStorage.setItem('aoo1_id', myPeerId);

    let blockedUsers = JSON.parse(localStorage.getItem('aoo1_blocked') || '[]');
    let currentTarget = 'main';
    
    const notifSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
    const shopSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3');
    
    document.getElementById('myIdTag').innerText = "ID: " + myPeerId;
    if(localStorage.getItem('aoo1_pseudo')) document.getElementById('myPseudo').value = localStorage.getItem('aoo1_pseudo');

    // WebRTC PeerJS Setup
    const peer = new Peer(myPeerId);
    let peerConnections = {};

    peer.on('open', () => syncProfile());
    peer.on('connection', (conn) => {
        if(blockedUsers.includes(conn.peer)) return;
        conn.on('data', (data) => handleData(data, conn.peer));
    });

    function syncProfile() {
        const pseudo = document.getElementById('myPseudo').value.trim() || 'Anonyme';
        localStorage.setItem('aoo1_pseudo', pseudo);
        socket.emit('register', { peer_id: myPeerId, pseudo: pseudo });
    }

    // Gestion de la liste des connectés
    socket.on('peer_discovery', (users) => {
        const box = document.getElementById('peersBox');
        box.innerHTML = '';
        users.forEach(u => {
            if (u.peer_id !== myPeerId && !blockedUsers.includes(u.peer_id)) {
                box.innerHTML += `
                    <div class="user-card">
                        <span onclick="startPrivateChat('${u.peer_id}', '${u.pseudo}')" style="cursor:pointer; font-weight:bold;">🟢 ${u.pseudo}</span>
                        <div>
                            <button onclick="blockUser('${u.peer_id}')" style="background:#ff5555; font-size:9px; padding:2px 4px;">Bloquer</button>
                        </div>
                    </div>`;
            }
        });
        renderBlockedList();
    });

    socket.on('global_chat_message', (data) => {
        if(!blockedUsers.includes(data.sender_id) && currentTarget === 'main') {
            displayMsg({ sender: data.pseudo, text: data.text, isLocal: false });
            notifSound.play().catch(()=>{});
        }
    });

    function handleData(data, senderId) {
        if(blockedUsers.includes(senderId)) return;
        displayMsg({ sender: data.pseudo, text: data.text, isLocal: false });
        notifSound.play().catch(()=>{});
    }

    function sendCurrentMsg() {
        const input = document.getElementById('chatInput');
        const txt = input.value.trim();
        if(!txt) return;

        const myName = document.getElementById('myPseudo').value.trim() || 'Anonyme';
        const payload = { pseudo: myName, text: txt, sender_id: myPeerId };

        if(currentTarget === 'main') {
            socket.emit('send_chat_message', payload);
        } else if(peerConnections[currentTarget]) {
            peerConnections[currentTarget].send(payload);
        }

        displayMsg({ sender: myName, text: txt, isLocal: true });
        input.value = '';
    }

    function startPrivateChat(peerId, pseudo) {
        currentTarget = peerId;
        if(!peerConnections[peerId]) {
            const conn = peer.connect(peerId);
            conn.on('open', () => { peerConnections[peerId] = conn; });
            conn.on('data', (data) => handleData(data, peerId));
        }
        document.getElementById('msgBox').innerHTML = `<div style="color:#50fa7b; font-size:11px;">Chat Privé P2P avec ${pseudo}</div>`;
    }

    function switchSalon(type) {
        currentTarget = type;
        document.getElementById('msgBox').innerHTML = '';
    }

    function displayMsg(m) {
        const b = document.getElementById('msgBox');
        b.innerHTML += `
            <div class="msg-bubble ${m.isLocal ? 'local' : 'remote'}">
                <b style="font-size:10px; color:#ff79c6;">${m.sender}</b><br>
                ${m.text}
            </div>`;
        b.scrollTop = b.scrollHeight;
    }

    // Gestion LocalStorage Bloqués
    function blockUser(peerId) {
        if(!blockedUsers.includes(peerId)) {
            blockedUsers.push(peerId);
            localStorage.setItem('aoo1_blocked', JSON.stringify(blockedUsers));
            syncProfile();
        }
    }

    function unblockUser(peerId) {
        blockedUsers = blockedUsers.filter(id => id !== peerId);
        localStorage.setItem('aoo1_blocked', JSON.stringify(blockedUsers));
        syncProfile();
    }

    function renderBlockedList() {
        const box = document.getElementById('blockedBox');
        box.innerHTML = '';
        blockedUsers.forEach(id => {
            box.innerHTML += `<div style="display:flex; justify-content:space-between; margin-top:2px;">
                <span>ID: ${id.substring(0,6)}...</span>
                <button onclick="unblockUser('${id}')" style="font-size:8px; background:#50fa7b;">Débloquer</button>
            </div>`;
        });
    }

    // Audio et Modal Boutique
    function playShopSound() { shopSound.play().catch(()=>{}); }
    function openShop() { document.getElementById('shopModal').style.display = 'block'; }
    function closeShop() { document.getElementById('shopModal').style.display = 'none'; }
    function updateVolume() { 
        const v = document.getElementById('volControl').value;
        notifSound.volume = v;
        shopSound.volume = v;
    }

    function loadPhoto(elem) {
        const file = elem.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            document.getElementById('avatarImg').src = e.target.result;
            document.getElementById('avatarImg').style.display = 'block';
            document.getElementById('avatarText').style.display = 'none';
        };
        reader.readAsDataURL(file);
    }
</script>
</body>
</html>
